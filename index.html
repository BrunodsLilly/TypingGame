<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lua's Learning Adventure!</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Animated background -->
<div class="bg-bubbles">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<!-- ===== HOME SCREEN ===== -->
<div class="screen active" id="home">
    <div class="home-mascot">🌟</div>
    <h1 class="home-title">Lua's Learning Adventure</h1>
    <p class="home-subtitle">Press a key to play!</p>
    <div class="game-grid">
        <div class="game-card colors"  data-game="colors" data-key="1"><span class="card-icon">🎨</span><span class="card-label">Colors</span><span class="keycap card-key">1</span></div>
        <div class="game-card shapes"  data-game="shapes" data-key="2"><span class="card-icon">🔷</span><span class="card-label">Shapes</span><span class="keycap card-key">2</span></div>
        <div class="game-card count"   data-game="count"  data-key="3"><span class="card-icon">🔢</span><span class="card-label">Count</span><span class="keycap card-key">3</span></div>
        <div class="game-card letters" data-game="letters" data-key="4"><span class="card-icon">🔤</span><span class="card-label">ABCs</span><span class="keycap card-key">4</span></div>
        <div class="game-card animals" data-game="animals" data-key="5"><span class="card-icon">🐾</span><span class="card-label">Animals</span><span class="keycap card-key">5</span></div>
        <div class="game-card math"    data-game="math"   data-key="6"><span class="card-icon">➕</span><span class="card-label">Math</span><span class="keycap card-key">6</span></div>
        <div class="game-card numberfun" data-game="numberfun" data-key="n"><span class="card-icon">⚖️</span><span class="card-label">More &amp; Less</span><span class="keycap card-key">N</span></div>
        <div class="game-card takeaway" data-game="takeaway" data-key="t"><span class="card-icon">➖</span><span class="card-label">Take Away</span><span class="keycap card-key">T</span></div>
        <div class="game-card words"   data-game="words"  data-key="7"><span class="card-icon">📝</span><span class="card-label">Words</span><span class="keycap card-key">7</span></div>
        <div class="game-card fixword" data-game="fixword" data-key="f"><span class="card-icon">🧩</span><span class="card-label">Fix the Word</span><span class="keycap card-key">F</span></div>
        <div class="game-card wordsearch" data-game="wordsearch" data-key="w"><span class="card-icon">🔎</span><span class="card-label">Word Search</span><span class="keycap card-key">W</span></div>
        <div class="game-card patterns" data-game="patterns" data-key="8"><span class="card-icon">🔁</span><span class="card-label">Patterns</span><span class="keycap card-key">8</span></div>
        <div class="game-card rhymes"  data-game="rhymes" data-key="9"><span class="card-icon">🎵</span><span class="card-label">Rhymes</span><span class="keycap card-key">9</span></div>
        <div class="game-card memory"  data-game="memory" data-key="0"><span class="card-icon">🧠</span><span class="card-label">Memory</span><span class="keycap card-key">0</span></div>
        <div class="game-card opposites" data-game="opposites" data-key="e"><span class="card-icon">🔄</span><span class="card-label">Opposites</span><span class="keycap card-key">E</span></div>
        <div class="game-card reading" data-game="reading" data-key="r"><span class="card-icon">📖</span><span class="card-label">Reading</span><span class="keycap card-key">R</span></div>
        <div class="game-card geometry" data-game="geometry" data-key="g"><span class="card-icon">📐</span><span class="card-label">Geometry</span><span class="keycap card-key">G</span></div>
        <div class="game-card korean"   data-game="korean"   data-key="k"><span class="card-icon">🇰🇷</span><span class="card-label">Korean</span><span class="keycap card-key">K</span></div>
        <div class="game-card portuguese" data-game="portuguese" data-key="p"><span class="card-icon">🇧🇷</span><span class="card-label">Portuguese</span><span class="keycap card-key">P</span></div>
    </div>
</div>

<!-- ===== GAME SCREEN (reused for all modes) ===== -->
<div class="screen game-screen" id="game">
    <div class="top-bar">
        <button class="back-btn" id="back-btn"><span class="keycap" style="font-size:0.7rem; min-width:24px; height:24px;">Esc</span> <span>Back</span></button>
        <div class="stars-bar" id="stars-bar"></div>
        <div class="streak-badge" id="streak-badge">🔥 0</div>
    </div>
    <div class="prompt-area" id="prompt-area">
        <div class="prompt-emoji" id="prompt-emoji"></div>
        <div class="prompt-text" id="prompt-text"></div>
    </div>
    <div id="extra-area"></div>
    <div class="choices" id="choices"></div>
</div>

<!-- ===== Celebration Overlay ===== -->
<div class="celebration-overlay" id="celebration">
    <div class="celebration-text" id="celeb-text"></div>
</div>

<!-- Keyboard hint bar (shown during games) -->
<div class="key-hint-bar" id="key-hint-bar" style="display:none;">
    <span class="hint-text" id="key-hint-text">Press a key!</span>
</div>

<!-- Language toggle -->
<button class="lang-btn" id="lang-btn">🇺🇸</button>

<!-- Sound toggle -->
<button class="sound-btn" id="sound-btn">🔊</button>

<script src="js/audio.js"></script>
<script src="js/celebration.js"></script>
<script src="js/touch-keyboard.js"></script>
<script src="js/i18n.js"></script>
<script src="js/game-engine.js"></script>
<script src="js/game-rounds.js"></script>

</body>
</html>
